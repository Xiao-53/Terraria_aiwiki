[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "terraria-wiki-agent"
version = "0.1.0"
description = "Bounded-conversation AI backend for the local Terraria Wiki"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic-ai-slim[mcp,openai]==2.31.0",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/terraria_wiki_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "cross_language: requires the real Windows .NET Wiki Tool TestHost",
  "paid_provider: requires TERRARIA_AI_API_KEY and explicit paid-evaluation authorization",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["terraria_wiki_agent"]
